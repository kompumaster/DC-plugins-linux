name: Release (Linux)

# One release train, four archives:
#   git tag linux-v0.1.0 && git push origin linux-v0.1.0
on:
  push:
    tags:
      - 'linux-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-webengine-dev libqt6webenginewidgets6 \
            qt6-svg-dev qt6-image-formats-plugins \
            libavformat-dev libavcodec-dev libavutil-dev \
            libpoppler-glib-dev ffmpeg imagemagick xvfb zip

      - name: Build all plugins
        run: |
          set -e
          for dir in markdown-wlx media-info-wdx image-wlx book-wlx; do
            echo "==> $dir"
            ( cd "$dir" && ./build.sh )
          done

      - name: Read plugin versions
        run: |
          set -e
          mdv=$(sed -n 's/.*#define MDV_VERSION "\([^"]*\)".*/\1/p' markdown-wlx/MarkdownView.cpp | head -1)
          miv=$(sed -n 's/.*#define MI_VERSION "\([^"]*\)".*/\1/p'  media-info-wdx/MediaInfo.cpp | head -1)
          ivv=$(sed -n 's/.*#define IV_VERSION "\([^"]*\)".*/\1/p'  image-wlx/ImageView.cpp | head -1)
          bvv=$(sed -n 's/.*#define BV_VERSION "\([^"]*\)".*/\1/p'  book-wlx/BookView.cpp | head -1)
          for v in "$mdv" "$miv" "$ivv" "$bvv"; do
            [ -n "$v" ] || { echo "could not read a plugin VERSION"; exit 1; }
          done
          {
            echo "MDV=$mdv"
            echo "MIV=$miv"
            echo "IVV=$ivv"
            echo "BVV=$bvv"
            echo "RELEASE=${GITHUB_REF_NAME##linux-v}"
          } >> "$GITHUB_ENV"

      - name: Assemble one archive per plugin
        run: |
          set -e
          rm -rf out && mkdir out

          package() { # dir, bundle, binary, version, assets(0/1), ini-sample(0/1)
            dir="$1"; bundle="$2"; bin="$3"; version="$4"; assets="$5"; ini="$6"
            rm -rf "out/$bundle" && mkdir "out/$bundle"
            cp "$dir/build/$bin" "out/$bundle/"
            if [ "$assets" = "1" ]; then cp -R "$dir/assets" "out/$bundle/assets"; fi
            cp "$dir/install.sh" "$dir/register_plugin.py" "$dir/README.md" \
               "$dir/THIRD_PARTY_LICENSES.md" "out/$bundle/"
            if [ "$ini" = "1" ]; then cp "$dir"/*.ini.sample "out/$bundle/"; fi
            ( cd out && zip -rqy "$dir-$version-linux.zip" "$bundle" )
          }

          package markdown-wlx   MarkdownView MarkdownView.wlx "$MDV" 1 1
          package media-info-wdx MediaInfo    MediaInfo.wdx    "$MIV" 0 0
          package image-wlx      ImageView    ImageView.wlx    "$IVV" 0 0
          package book-wlx       BookView     BookView.wlx     "$BVV" 1 1

          ( cd out && sha256sum ./*-linux.zip > SHA256SUMS && cat SHA256SUMS )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Linux plugins v${{ env.RELEASE }}
          body: |
            Four Linux plugins for Double Commander, one archive each. Unzip the
            one you need, quit Double Commander, then run `./install.sh`.

            | Plugin | Version | Archive |
            |---|---|---|
            | markdown-wlx | ${{ env.MDV }} | `markdown-wlx-${{ env.MDV }}-linux.zip` |
            | media-info-wdx | ${{ env.MIV }} | `media-info-wdx-${{ env.MIV }}-linux.zip` |
            | image-wlx | ${{ env.IVV }} | `image-wlx-${{ env.IVV }}-linux.zip` |
            | book-wlx | ${{ env.BVV }} | `book-wlx-${{ env.BVV }}-linux.zip` |

            Plugin versions are independent; the release tag is just the train.
            Verify the downloads with `sha256sum -c SHA256SUMS`.

            Built for **x86_64**; on other architectures build from source with
            `./build.sh`.
          files: |
            out/markdown-wlx-${{ env.MDV }}-linux.zip
            out/media-info-wdx-${{ env.MIV }}-linux.zip
            out/image-wlx-${{ env.IVV }}-linux.zip
            out/book-wlx-${{ env.BVV }}-linux.zip
            out/SHA256SUMS
